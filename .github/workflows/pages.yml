name: Deploy Pages

# Builds the static browser build in docs/ and publishes it to GitHub Pages.
# The anydoc WebAssembly engine is fetched from npm at build time rather than
# committed, so the ~6 MB binary stays out of git.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch anydoc-wasm into the site
        run: |
          npm install --no-save @firecrawl/anydoc-wasm@0.1.5
          cp node_modules/@firecrawl/anydoc-wasm/anydoc_wasm.js docs/
          cp node_modules/@firecrawl/anydoc-wasm/anydoc_wasm_bg.wasm docs/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
